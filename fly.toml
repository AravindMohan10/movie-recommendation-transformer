# fly.toml app configuration file generated for movie-recommendation-transformer on 2026-02-01T18:14:05-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'movie-recommendation-transformer'
primary_region = 'ewr'

[build]

[env]
  # CORS: allow Vercel frontend + local dev. Override with: fly secrets set ALLOWED_ORIGINS="..."
  ALLOWED_ORIGINS = "https://cineai-flame.vercel.app,http://localhost:5173,http://localhost:3000"
  # SQLite on persistent volume (must match [mounts] destination)
  DATABASE_PATH = "/data/cineai.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  # Wait longer for app to bind (Python imports + DB init take ~15-20s on cold start)
  grace_period = "60s"

[mounts]
  source = "cineai_data"
  destination = "/data"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
